{# Floating chat widget — include in base.html after main content #}
<div id="chat-widget" class="fixed bottom-4 right-4 z-50" data-chat-url="{% url 'ai_assistant:chat_api' %}">
  <button id="chat-open" type="button" class="chat-open-btn btn btn-primary rounded-full px-4 py-2 shadow-lg" aria-label="Open chat assistant" aria-expanded="false" aria-controls="chat-panel">
    Ask about me
  </button>
  <div id="chat-panel" class="chat-panel hidden mt-2 w-80 sm:w-96 rounded-lg border border-edge bg-surface text-ink shadow-xl overflow-hidden">
    <header class="flex items-center justify-between border-b border-edge px-4 py-2">
      <h2 class="text-sm font-medium">Ask about my work</h2>
      <button id="chat-close" type="button" class="text-ink-muted hover:text-ink" aria-label="Close chat">✕</button>
    </header>
    <div id="chat-log" class="max-h-80 overflow-y-auto px-4 py-3 space-y-3 text-sm" aria-live="polite"></div>
    <form id="chat-form" class="border-t border-edge flex" novalidate>
      <label for="chat-input" class="sr-only">Your question</label>
      <input id="chat-input" name="message" type="text" autocomplete="off" required maxlength="500" placeholder="e.g. What's your Django experience?" class="flex-1 bg-surface px-3 py-2 text-ink placeholder:text-ink-muted focus-visible:outline-2 focus-visible:outline-accent">
      <button type="submit" class="px-4 bg-accent text-on-accent hover:bg-accent-strong">Send</button>
    </form>
  </div>
</div>
