<article class="card flex flex-col gap-3">
  {% if project.image %}
    <img src="{{ project.image.url }}" alt="{{ project.title }}" class="w-full aspect-video object-cover rounded-md mb-4" loading="lazy">
  {% endif %}
  <h3 class="font-semibold">{{ title }}</h3>
  <p class="flex-1 text-sm text-ink-muted">{{ description }}</p>
  <div class="flex flex-wrap gap-2">
    {% for tag in tags %}
      <span class="badge">{{ tag }}</span>
    {% endfor %}
  </div>
  <a href="{{ url }}" class="inline-block py-2 text-sm text-accent hover:underline">View project →</a>
</article>
