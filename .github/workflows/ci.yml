name: CI

on:
  push:
    branches:
      - main
      - phase1/base-ui
      - phase2/content-apps
      - phase3/blog-contact-seo
      - phase4/devops-showcase
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/production.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements/base.txt -r requirements/production.txt

      - name: Build CSS
        run: npm ci && npm run build

      - name: Django system check
        run: python manage.py check

      - name: Django tests
        run: python manage.py test --verbosity=1

      - name: JS tests
        run: npm test

      - name: 'Lint: black --check (informational — see README "Lint debt" section)'
        continue-on-error: true
        run: black --check .
      - name: 'Lint: isort --check-only (informational)'
        continue-on-error: true
        run: isort --check-only .
      - name: 'Lint: flake8 (informational)'
        continue-on-error: true
        run: flake8 .
